    - ID: "581d7a02-ce94-4a73-9add-258867a8b60f"
      Hint: Content
      Value: "<p>Welcome back. We're glad to see you again.</p><p>Whether you're starting your next book, exploring a new format for one you've already published, or returning to launch a series, we've built tools and offers specifically for authors who have published with us before.</p><h2>Returning author benefits</h2><ul><li><strong>Returning author discount.</strong> Save on your next publishing plan when you publish multiple books with us.</li><li><strong>Streamlined onboarding.</strong> We already have your author profile, payment details, and preferences — your next book can launch faster.</li><li><strong>Series support.</strong> Dedicated planning and marketing tools for authors building a book series, including consistent cover treatments and unified launch strategies.</li><li><strong>Format extensions.</strong> Already published a paperback with us? Add audiobook, hardcover, or international distribution to an existing title at a returning-author rate.</li><li><strong>Priority consultation booking.</strong> Returning authors get priority scheduling with publishing consultants.</li></ul><h2>Ready for your next book?</h2><p>Log in to your Author Center to view your existing titles, royalty reports, and resources — or schedule a returning-author consultation to talk about what's next.</p>"
