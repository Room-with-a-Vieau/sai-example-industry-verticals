      Hint: PromoDescription
      Value: |
        <div class="ck-content"><p>The idea of Carnegie Hall was born in the spring of 1887 during the honeymoon of Andrew Carnegie and Louise Whitfield. While on their transatlantic steamship voyage to Scotland, a friendship developed with Walter Damrosch—a leading conductor and musical director of the age—who dreamt of a new concert hall in New York City. The Hall opened four years later in 1891 and has been home to more than a century of meaningful moments in its vibrant history. And now, your lifelong duet can premiere at Carnegie Hall.</p></div>
