      Value: What to Do When an Energy Emergency Alert Is Issued
    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p>When Gridwell Financial detects unusual activity on a merchant account, our team issues a Critical Fraud Alert. These alerts are not routine notifications — they signal that an account may be at immediate risk and that quick action is needed to prevent losses or service disruption.</p><p>The most effective steps a merchant can take are to log into Merchant Direct, review recent transactions, and confirm or dispute any flagged charges. Disabling card-on-file processing temporarily, requiring CVV on all transactions, and changing portal passwords are also strongly recommended. Our 24/7 support team is available to walk merchants through the response process.</p><p>By acting on a Critical Fraud Alert quickly, businesses can stop fraudulent transactions before they settle and avoid chargebacks entirely. Signing up for both standard fraud alerts and Critical Fraud Alerts ensures that merchants are always notified through the right channel at the right urgency level.</p></div>
    - ID: "62c99938-d40e-4878-ab77-3464abd79fd5"
      Hint: ShortDescription
      Value: A Critical Fraud Alert signals that a merchant account is at immediate risk and requires action. Many business owners are unsure of the right steps to take when one is issued, leading to delays that can be costly. Following a clear response process protects revenue and customers. This article outlines the exact steps to take when a Critical Fraud Alert is issued.
