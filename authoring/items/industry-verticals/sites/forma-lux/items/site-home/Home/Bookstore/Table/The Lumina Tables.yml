      Hint: metadataDescription
      Value: "Descubre Las Mesas Lumina de Forma Lux: un par de mesas nido hechas a mano, diseñadas con simplicidad atemporal y materiales sostenibles. Proporciones elegantes, roble natural y artesanía duradera definen este esencial moderno para el hogar."
