    - ID: "729034fc-24f3-40b7-8fa4-fb49d7de20dd"
      Hint: Text
      Value: "<h2>What's Included</h2><p>Hosting your wedding with us means working alongside an experienced team committed to bringing your vision to life. Every wedding package includes:</p><ul><li><strong>Dedicated event manager</strong> to guide you from initial planning through your celebration day</li><li><strong>Curated catering options</strong> from our roster of preferred culinary partners</li><li><strong>Ceremony and reception flexibility</strong> with rooms that can be configured to suit your program</li><li><strong>Audio-visual support</strong> including in-house sound systems and lighting</li><li><strong>Tables, chairs, and standard linens</strong> in classic styles</li><li><strong>Coordinated vendor access</strong> for florists, photographers, and entertainment</li></ul>"
