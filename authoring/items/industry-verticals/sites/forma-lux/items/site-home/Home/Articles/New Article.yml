    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:0.9rem;margin-top:0px;orphans:2;text-align:justify;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Don’t just focus on hyperdrives and transporters.</strong> Yes, you read that right. Science fiction writers tend to focus on advances in technology; well, don’t be afraid to look at other disciplines too! What will philosophy look like in the future? Archaeology? Sociology? Music?</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:0.9rem;margin-top:0px;orphans:2;text-align:justify;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Think about the negative side of a scientific breakthrough.</strong> The positive results of scientific progress are easy to imagine. After all, they’re the main reason we’re trying to advance science to begin with. But what about the downside? Okay, so medical advancements allow people to live for centuries; how does that affect overpopulation, resource depletion, the job market, etc. Imagining the negative can give you an entirely new angle to write about.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:0.9rem;margin-top:0px;orphans:2;text-align:justify;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Don’t shy away from the big subjects.</strong> The movie <em style="box-sizing:border-box;"><em>Prometheus</em></em> was about no less than the creation of life on Earth. If you have an idea, don’t be scared of tackling large, “macro” topics like this. The good news is, it’s unlikely that real-world scientific advances will disprove your theory any time soon.</p><p><a style="background-color:transparent;box-shadow:none;box-sizing:border-box;color:rgb(0, 0, 0);text-decoration:none;" href="https://blog.authorhouse.com/wp-content/uploads/2020/10/Ship.jpg"><strong><img class="wp-image-530 image-style-align-left" style="border-image:initial;border-radius:0px;border:medium none currentcolor;box-shadow:none;box-sizing:border-box;height:auto;max-width:100%;" src="https://blog.authorhouse.com/wp-content/uploads/2020/10/Ship.jpg" alt="" width="259" height="194" loading="lazy" /></strong></a></p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:0.9rem;margin-top:0px;orphans:2;text-align:justify;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Find a popular sci-fi writer to disagree with.</strong> Hopefully, as someone who wants to write science fiction, you’re also an avid sci-fi reader! Think about some of those stories. Were you intrigued by another writer’s setting or concept, but disagree with the direction he or she took? Now’s your chance to “correct” the mistake! We’re not suggesting plagiarism; rather, we’re saying that you can use other stories to provide the seeds for your own unique take on things.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:0.9rem;margin-top:0px;orphans:2;text-align:justify;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">What if disproved theories had turned out to be true?</strong> What if the Earth really was flat? Research beliefs and theories, some of which might be thousands of years old, and then imagine what would happen if they were true? Granted, this kind of thinking can quickly turn your science fiction story into one of fantasy, but who cares if it’s a story you want to tell?</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:0.9rem;margin-top:0px;orphans:2;text-align:justify;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">We’ll be back with more tips about writing in the ever-surprising, ever-expanding science fiction genre. Until then, browse the <a style="background-color:transparent;box-shadow:none;box-sizing:border-box;color:rgb(0, 0, 0);text-decoration:none;" href="http://bookstore.authorhouse.com/"><strong style="box-sizing:border-box;font-weight:bolder;">AuthorHouse Bookstore</strong></a> for the latest sci-fi offerings from our self-publishing author community.</p></div>
