    - ID: "581d7a02-ce94-4a73-9add-258867a8b60f"
      Hint: Content
      Value: "<p>Every AuthorHouse plan is built on a foundation of core services, but every book is different. Our à la carte publishing services let you add exactly what your project needs — nothing more, nothing less.</p><h2>Editorial services</h2><ul><li><strong>Developmental editing.</strong> Deep structural feedback on story, argument, and flow.</li><li><strong>Substantive editing.</strong> Sentence- and paragraph-level work to tighten prose and clarify meaning.</li><li><strong>Proofreading.</strong> Final-pass review for typos, punctuation, and formatting issues.</li><li><strong>Manuscript critique.</strong> Professional assessment of your manuscript before you commit to a publishing plan.</li></ul><h2>Design services</h2><ul><li><strong>Custom cover design.</strong> One-of-a-kind covers designed by our in-house design team.</li><li><strong>Interior layout.</strong> Custom interior design for illustrated books, photography books, and complex layouts.</li><li><strong>Illustration coordination.</strong> Match with a children's illustrator from our network.</li></ul><h2>Marketing & publicity</h2><ul><li><strong>Press release writing & distribution.</strong> Professionally written press release distributed to relevant media outlets.</li><li><strong>Author website.</strong> Custom-designed author website with hosting and basic content management.</li><li><strong>Book trailer production.</strong> Short video trailer for your book, suitable for social media and your website.</li><li><strong>Goodreads & social media setup.</strong> Author profile creation and platform optimization across the major book-discovery platforms.</li><li><strong>Email marketing kit.</strong> Templates, list-building tools, and a launch-sequence playbook.</li></ul><h2>Distribution & rights</h2><ul><li><strong>US copyright registration.</strong> We handle the filing and paperwork with the US Copyright Office.</li><li><strong>Library of Congress Control Number (LCCN).</strong> Required for many library acquisitions.</li><li><strong>International distribution expansion.</strong> Extend your book's reach to additional international territories.</li><li><strong>Audiobook production.</strong> Professional audiobook production with experienced narrators.</li></ul><h2>Not sure where to start?</h2><p>Schedule a free consultation. We'll help you identify which services will have the biggest impact on your book's success.</p>"
