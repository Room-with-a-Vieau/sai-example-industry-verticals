        <h2>About AuthorHouse</h2><h3>Who is AuthorHouse?</h3><p>AuthorHouse is the leading provider of supported self-publishing services for authors worldwide. Since 1997, we've helped more than 70,000 authors publish more than 96,000 titles across 200 genres.</p><h3>What is supported self-publishing?</h3><p>Supported self-publishing pairs the speed and creative control of self-publishing with the professional services traditionally offered by publishing houses — editing, design, distribution, and marketing support. You keep your rights and royalties; we handle the technical complexities.</p><h2>About our plans</h2><h3>How do I know which plan is right for me?</h3><p>Start by taking our author quiz, which will recommend a plan based on your goals. You can also schedule a free consultation with a publishing consultant who will walk you through your options.</p><h3>Can I upgrade my plan after I start?</h3><p>Yes. Many authors begin with Essentials and add à la carte services or upgrade to a higher plan as their publishing journey evolves.</p><h3>What does "included" actually mean?</h3><p>Everything listed as "included" in a plan is delivered as part of the plan price — no hidden fees, no surprise charges. Optional add-on services are clearly priced separately.</p><h2>About the publishing process</h2><h3>How long does it take to publish a book?</h3><p>Most authors complete the publishing process in 4 to 9 months, depending on the plan, the complexity of the book, and how quickly the manuscript moves through editorial review. Children's books with detailed illustrations typically take longer.</p><h3>Who owns the rights to my book?</h3><p>You do. AuthorHouse never claims ownership of your manuscript or any of the rights to your book. You retain 100% of your rights and royalties.</p><h3>Where will my book be sold?</h3><p>Every AuthorHouse plan includes distribution to major retailers (Amazon, Barnes & Noble, Apple Books, Kobo) and to the Ingram catalog, which makes your book available to bookstores and libraries worldwide.</p><h2>About payments and refunds</h2><h3>Do you offer payment plans?</h3><p>Yes. Speak with a publishing consultant about payment options that fit your budget.</p><h3>What is your refund policy?</h3><p>Refund eligibility depends on which services have been delivered. Full details are provided in your publishing services agreement, and your consultant will walk you through them before you commit.</p>
