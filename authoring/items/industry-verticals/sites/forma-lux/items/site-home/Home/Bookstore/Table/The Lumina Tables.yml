    - ID: "e35644f6-b680-4f40-9c7a-def95adfedda"
      Hint: LongDescription
      Value: |
        <div class="ck-content"><p>The Momentum plan is for authors ready to launch their book into the world with maximum impact. Hardcover, paperback, audiobook, and eBook publishing combine with our most advanced editorial, marketing, and audience-building tools to give your book every advantage.</p><h3>Everything in Balance, plus</h3><ul><li>Audiobook publishing (DIY)</li><li>Proofreading</li><li>US Copyright Registration</li><li>Custom press release</li><li>Podcast interview</li><li>Audience Builder Starter Kit</li></ul><h3>Who it's for</h3><p>Authors with a message they're ready to push into the market — fiction writers building a readership, nonfiction authors driving thought leadership, and creators who want their book heard in audio as well as read in print and digital.</p><p><em>You save 25% — MSRP $7,589.</em></p></div>
    - ID: "e5b1f5b3-a36d-4fd3-8df7-c9878ebfb6cf"
      Hint: pageSummary
      Value: "The Momentum plan is built for authors ready to launch with maximum impact — hardcover, paperback, audiobook, and eBook publishing combined with our most advanced editorial, marketing, and audience-building tools. Starting at $5,499."
