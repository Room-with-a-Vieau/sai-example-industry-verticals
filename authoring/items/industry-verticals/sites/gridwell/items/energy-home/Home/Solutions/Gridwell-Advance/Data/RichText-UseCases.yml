        <div class="ck-content"><h2>Put your advance to work</h2><p>How you use the funds is entirely up to you. Every business has its own goals, and Gridwell Advance is designed to flex around them. Some of the ways merchants put their advance to work include:</p><h3>Refresh your space</h3><p>Update your storefront, refresh interiors, or invest in new equipment that helps you serve more customers, more comfortably.</p><h3>Hire and train your team</h3><p>Bring on the staff you need to grow, and give them the training that turns a new hire into a key contributor.</p><h3>Stock up on inventory</h3><p>Buy in bulk ahead of busy seasons, take advantage of supplier discounts, or expand your product range without straining cash flow.</p><h3>Invest in marketing</h3><p>Launch a paid social campaign, send out a direct mailer, or update your website to bring in new customers and remind existing ones why they love you.</p><h3>Cover unexpected costs</h3><p>From a broken oven to an emergency repair, sometimes things come up. An advance gives you a buffer to handle the unexpected without derailing your plans.</p></div>
