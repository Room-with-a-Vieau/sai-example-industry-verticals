        <div class="ck-content"><h2>Three ways to set up your kiosk</h2><p>Every restaurant layout is different, so the kiosk hardware ships with flexible mounting options. Pick the configuration that works best for your space and your guest flow.</p><h3>Floor stand</h3><p>A free-standing pedestal that sits anywhere there's floor space and a power outlet. Ideal for entrances, lobbies, and high-traffic areas where you want a clear ordering station that's easy to spot from the door.</p><h3>Countertop</h3><p>A compact base unit that sits directly on a counter or table. A great fit for smaller footprints, ghost kitchens, food halls, or any spot where you'd rather use existing furniture than add a stand.</p><h3>Wall or pedestal mount</h3><p>Bracket-mount the kiosk to a wall or fixed pedestal for a permanent, space-saving setup. Useful in tight quick-service layouts where you want the screen visible but the floor clear.</p></div>
