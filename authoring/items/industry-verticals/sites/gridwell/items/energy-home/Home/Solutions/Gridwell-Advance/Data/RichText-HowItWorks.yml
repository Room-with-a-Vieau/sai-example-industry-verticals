        <div class="ck-content"><h2>How Gridwell Advance works</h2><p>From first conversation to funded account, the process is built to be straightforward. Here's what to expect.</p><h3>1. Check your eligibility</h3><p>Connect with a Gridwell funding specialist to confirm whether your business qualifies. We look at your sales history with us, not just your credit score, so the door is open even if traditional bank financing has been a struggle.</p><h3>2. Receive your offer</h3><p>If you're eligible, we'll share a pre-approved funding amount along with the one-time fee and repayment percentage. Everything is laid out in plain language so there are no surprises.</p><h3>3. Sign and submit</h3><p>Once you accept the terms, your specialist sends over a short application to sign electronically. There's no mountain of paperwork and no collateral required.</p><h3>4. Get funded fast</h3><p>After review and approval, funds are typically deposited into your business account within three business days — often in less than 72 hours.</p><h3>5. Repay automatically as you sell</h3><p>A small, agreed-upon percentage is taken from each sale you process through Gridwell until the advance is fully repaid. There are no due dates to track and no penalty for paying it down faster on a strong sales week.</p></div>
