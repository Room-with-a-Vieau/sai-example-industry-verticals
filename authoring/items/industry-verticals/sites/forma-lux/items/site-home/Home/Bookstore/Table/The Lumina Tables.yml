      Value: "Découvrez les Tables Lumina de Forma Lux — une paire de tables gigognes fabriquées à la main, conçues avec une simplicité intemporelle et des matériaux durables. Des proportions élégantes, du chêne naturel et un savoir-faire durable définissent cet essentiel moderne pour le salon."
